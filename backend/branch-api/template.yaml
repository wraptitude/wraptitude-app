AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Authenticated multi-branch API for Wraptitude mobile and admin applications.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  CustomerUserPoolId:
    Type: String
    Default: us-east-2_YkquiI7T9
  CustomerAppClientId:
    Type: String
    Default: 7vlqq7r376oloodmlr2vgucfgl
  AdminOrigin:
    Type: String
    Default: https://main.dfik0czr5tmeb.amplifyapp.com
  LegacyNewsRoleName:
    Type: String
    Default: wraptitudeAppGetAllNews-role-wwbf6bc5
    Description: Existing role for the news API used by installed mobile apps.

Resources:
  CustomerAccountSignup:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: wraptitudeCustomerAccountSignup
      Runtime: python3.12
      Handler: account_signup.lambda_handler
      CodeUri: .
      Timeout: 5
      Environment:
        Variables:
          USER_TABLE: wraptitudeAppUser
          MEMBERSHIP_TABLE: !Ref BranchMembershipTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: wraptitudeAppUser
        - DynamoDBCrudPolicy:
            TableName: !Ref BranchMembershipTable

  CustomerAccountSignupPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CustomerAccountSignup
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CustomerUserPoolId}

  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: wraptitude-admin
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      UserPoolAddOns:
        AdvancedSecurityMode: ENFORCED
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: wraptitude-admin-web
      UserPoolId: !Ref AdminUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  SuperAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: super-admin
      Description: Access to all Wraptitude branches
      UserPoolId: !Ref AdminUserPool

  MarkhamAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: markham-admin
      Description: Access to Markham only
      UserPoolId: !Ref AdminUserPool

  VaughanAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: vaughan-admin
      Description: Access to Vaughan only
      UserPoolId: !Ref AdminUserPool

  BranchMembershipTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: wraptitudeBranchMembership
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: branchId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: clientCreatedAt
          AttributeType: S
      KeySchema:
        - AttributeName: branchId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: branchId-clientCreatedAt-index
          KeySchema:
            - AttributeName: branchId
              KeyType: HASH
            - AttributeName: clientCreatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - createdAt
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  AppVersionPolicyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: wraptitudeAppVersionPolicy
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: platform
          AttributeType: S
      KeySchema:
        - AttributeName: platform
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  InvoiceNumberTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Both branches share a durable invoice sequence with one assignment per service order.
        must:
          - Commit each number and its order assignment in one conditional transaction.
          - Retain the ledger on replacement or stack deletion so invoice numbers are never reused.
    Properties:
      TableName: !Sub '${AWS::StackName}-invoices'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  NewsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Editable articles replace the hardcoded feed while retaining existing news.
        must:
          - Return only published articles through the public mobile feed.
          - Preserve articles on stack deletion or replacement.
    Properties:
      TableName: !Sub '${AWS::StackName}-news'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  LegacyNewsReadPolicy:
    Type: AWS::IAM::Policy
    Metadata:
      com.aws.cloudformation.Context:
        why: Installed apps keep their existing news URL and Lambda function.
        must:
          - Limit image reads to news objects; customer service images stay private.
    Properties:
      PolicyName: WraptitudeManagedNewsRead
      Roles:
        - !Ref LegacyNewsRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: dynamodb:Scan
            Resource: !GetAtt NewsTable.Arn
          - Effect: Allow
            Action: s3:GetObject
            Resource: !Sub '${PrivateServiceBucket.Arn}/news/*'

  PrivateServiceBucket:
    Type: AWS::S3::Bucket
    Metadata:
      com.aws.cloudformation.Context:
        why: Admin browsers upload service images directly with short-lived signed PUT URLs.
        must:
          - Allow the configured AdminOrigin and Content-Type header for browser PUT requests.
          - Keep images private; CORS does not replace signed URL authorization.
    Properties:
      BucketName: !Sub wraptitude-service-private-${AWS::AccountId}-${AWS::Region}
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref AdminOrigin
            AllowedMethods:
              - PUT
            AllowedHeaders:
              - Content-Type
            MaxAge: 600
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  PrivateQuoteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub wraptitude-quote-private-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  PrivateEmergencyBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub wraptitude-emergency-private-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  BranchApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins:
          - !Ref AdminOrigin
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - OPTIONS
        MaxAge: 600
      Auth:
        Authorizers:
          CustomerAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              audience:
                - !Ref CustomerAppClientId
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CustomerUserPoolId}
          AdminAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              audience:
                - !Ref AdminUserPoolClient
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${AdminUserPool}

  BranchApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Authenticated admin news editing shares existing branch authorization and upload infrastructure.
        must:
          - Authorize the selected branch before reading drafts or writing articles.
          - Retain all existing customer, order, invoice and upload routes.
    Properties:
      FunctionName: wraptitudeBranchApi
      Runtime: python3.12
      Handler: app.lambda_handler
      CodeUri: .
      MemorySize: 512
      Timeout: 29
      Environment:
        Variables:
          SERVICE_TABLE: wraptitudeAppService
          CUSTOMER_USER_POOL_ID: !Ref CustomerUserPoolId
          USER_TABLE: wraptitudeAppUser
          QUOTE_TABLE: wraptitudeAppQuote
          NON_URGENT_TABLE: wraptitudeAppEmergencyServiceNonUrgentForm
          URGENT_TABLE: wraptitudeAppEmergencyServiceUrgentRecord
          MEMBERSHIP_TABLE: !Ref BranchMembershipTable
          VERSION_POLICY_TABLE: !Ref AppVersionPolicyTable
          PRIVATE_SERVICE_BUCKET: !Ref PrivateServiceBucket
          PRIVATE_QUOTE_BUCKET: !Ref PrivateQuoteBucket
          PRIVATE_EMERGENCY_BUCKET: !Ref PrivateEmergencyBucket
          LEGACY_SERVICE_BUCKET: wraptitude-service
          LEGACY_QUOTE_BUCKET: wraptitude-quote
          LEGACY_EMERGENCY_BUCKET: wraptitude-emergency-service-non-urgent-form
          INVOICE_EMAIL_FUNCTION: send_invoice_email
          INVOICE_NUMBER_TABLE: !Ref InvoiceNumberTable
          NEWS_TABLE: !Ref NewsTable
          NON_URGENT_TOPIC_ARN: arn:aws:sns:us-east-2:539247487854:wraptitudeAppEmergencyServiceNonUrgentForm
          ADMIN_ORIGIN: !Ref AdminOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt NewsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt InvoiceNumberTable.Arn
            - Effect: Allow
              Action: cognito-idp:AdminGetUser
              Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CustomerUserPoolId}
        - DynamoDBCrudPolicy:
            TableName: wraptitudeAppService
        - DynamoDBCrudPolicy:
            TableName: wraptitudeAppUser
        - DynamoDBCrudPolicy:
            TableName: wraptitudeAppQuote
        - DynamoDBCrudPolicy:
            TableName: wraptitudeAppEmergencyServiceNonUrgentForm
        - DynamoDBCrudPolicy:
            TableName: wraptitudeAppEmergencyServiceUrgentRecord
        - DynamoDBCrudPolicy:
            TableName: !Ref BranchMembershipTable
        - DynamoDBReadPolicy:
            TableName: !Ref AppVersionPolicyTable
        - S3CrudPolicy:
            BucketName: wraptitude-service
        - S3CrudPolicy:
            BucketName: !Ref PrivateServiceBucket
        - S3CrudPolicy:
            BucketName: wraptitude-quote
        - S3CrudPolicy:
            BucketName: !Ref PrivateQuoteBucket
        - S3CrudPolicy:
            BucketName: wraptitude-emergency-service-non-urgent-form
        - S3CrudPolicy:
            BucketName: !Ref PrivateEmergencyBucket
        - LambdaInvokePolicy:
            FunctionName: send_invoice_email
        - SNSPublishMessagePolicy:
            TopicName: wraptitudeAppEmergencyServiceNonUrgentForm
      Events:
        PublicApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BranchApi
            Path: /public/{proxy+}
            Method: ANY
        CustomerApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BranchApi
            Path: /customer/{proxy+}
            Method: ANY
            Auth:
              Authorizer: CustomerAuthorizer
        CustomerPreflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref BranchApi
            Path: /customer/{proxy+}
            Method: OPTIONS
        AdminApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BranchApi
            Path: /admin/{proxy+}
            Method: ANY
            Auth:
              Authorizer: AdminAuthorizer
        AdminPreflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref BranchApi
            Path: /admin/{proxy+}
            Method: OPTIONS

Outputs:
  ApiUrl:
    Value: !Sub https://${BranchApi}.execute-api.${AWS::Region}.amazonaws.com
  AdminUserPoolId:
    Value: !Ref AdminUserPool
  AdminUserPoolClientId:
    Value: !Ref AdminUserPoolClient
  MembershipTableName:
    Value: !Ref BranchMembershipTable
  AppVersionPolicyTableName:
    Value: !Ref AppVersionPolicyTable
  PrivateServiceBucketName:
    Value: !Ref PrivateServiceBucket
  PrivateQuoteBucketName:
    Value: !Ref PrivateQuoteBucket
  PrivateEmergencyBucketName:
    Value: !Ref PrivateEmergencyBucket
